name = "anthonybestsite"
main = "worker/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "anthonybestsite-db"
database_id = "REPLACE_AFTER_CREATE"

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
ADMIN_EMAILS = "anthony@anthonybest.com"
