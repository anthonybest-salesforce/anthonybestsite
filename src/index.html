  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c8a96e;
      --gold-dim: rgba(200, 169, 110, 0.45);
      --gold-faint: rgba(200, 169, 110, 0.10);
      --text: #e8e4dc;
      --muted: #cc6633;
      --card-bg: rgba(8, 8, 10, 0.52);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-hover: rgba(255, 255, 255, 0.16);
    }

    html, body {
      min-height: 100%;
      font-family: 'Syne', sans-serif;
      color: var(--text);
      background-color: #0c0c0d;
    }

    /* Background image */
    body {
      background-image: url('./assets/images/hero-bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Dark overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(5, 5, 6, 0.70) 0%,
        rgba(5, 5, 6, 0.58) 40%,
        rgba(5, 5, 6, 0.74) 100%
      );
      z-index: 0;
    }

    /* Ambient warm glow */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.05) 0%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    /* Page layout */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 40px;
    }

    /* Centered column */
    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ── */
    .logo-wrap {
      position: relative;
      width: 102px;
      height: 102px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0s forwards;
    }

    .logo-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(14, 14, 16, 0.7);
      border: 1px solid rgba(200, 169, 110, 0.22);
      position: relative;
      z-index: 1;
    }

    .logo-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(200, 169, 110, 0.45);
      border-right-color: rgba(200, 169, 110, 0.10);
      animation: spin 9s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Name ── */
    .name {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.07s forwards;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.13s forwards;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.17s forwards;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200, 169, 110, 0.35));
    }

    .divider-line:last-child {
      background: linear-gradient(to left, transparent, rgba(200, 169, 110, 0.35));
    }

    .divider-gem {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 32px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      transition:
        transform 0.22s cubic-bezier(.22,1,.36,1),
        border-color 0.22s ease,
        box-shadow 0.22s ease;
      opacity: 0;
    }

    .link-card:nth-child(1) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.24s forwards; }
    .link-card:nth-child(2) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.33s forwards; }
    .link-card:nth-child(3) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.42s forwards; }

    /* Gold left-bar */
    .link-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.22s ease;
      border-radius: 14px 0 0 14px;
    }

    /* Gold glow fill */
    .link-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at left center, rgba(200, 169, 110, 0.07) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--card-border-hover);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .link-card:hover::before,
    .link-card:hover::after {
      opacity: 1;
    }

    .link-card:active {
      transform: scale(0.98);
    }

    /* Icon bubble */
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
    }

    /* Card text */
    .card-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .card-platform {
      display: block;
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .card-label {
      display: block;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--text);
    }

    /* Arrow */
    .card-arrow {
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      position: relative;
      z-index: 1;
      transition:
        color 0.22s ease,
        transform 0.22s ease;
      flex-shrink: 0;
    }

    .link-card:hover .card-arrow {
      color: var(--gold);
      transform: translateX(4px);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.56s forwards;
    }

    .footer a {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-decoration: none;
      text-transform: lowercase;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text);
      border-bottom-color: rgba(232, 228, 220, 0.3);
    }

    /* ── Entrance animation ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
