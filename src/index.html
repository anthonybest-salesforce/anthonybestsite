<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthony Best</title>
  <meta name="description" content="Youtuber. Musician. Collector.">

  <!-- Open Graph -->
  <meta property="og:title" content="Anthony Best">
  <meta property="og:description" content="Youtuber. Musician. Collector.">
  <meta property="og:image" content="https://images.squarespace-cdn.com/content/v1/5b905fe15ffd207e641058e3/1570537599283-DRN61PPY106KAUPAEF8L/Home%2BMain.jpg?format=1500w">
  <meta property="og:url" content="https://anthonybest.com/links">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="canonical" href="https://anthonybest.com/links">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

  <!-- JSON-LD — Person schema (used by Salesforce resolvers + SEO) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "https://anthonybest.com/#person",
    "name": "Anthony Best",
    "url": "https://anthonybest.com",
    "image": "https://anthonybest.com/assets/images/hero-bg.jpg",
    "description": "Youtuber. Musician. Collector.",
    "jobTitle": "Content Creator",
    "sameAs": [
      "https://instagram.com/itsanthonybest",
      "https://linkedin.com/in/anthonylbest",
      "https://youtube.com/c/anthonybestmusic"
    ]
  }
  </script>

  <!-- JSON-LD — WebPage schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "https://anthonybest.com/links",
    "name": "Anthony Best — Links",
    "url": "https://anthonybest.com/links",
    "description": "Youtuber. Musician. Collector.",
    "author": { "@id": "https://anthonybest.com/#person" },
    "publisher": { "@id": "https://anthonybest.com/#person" }
  }
  </script>

  <!-- Salesforce Einstein Personalization SDK — replace YOUR_TENANT_ID -->
  <!-- <script src="https://cdn.c360a.salesforce.com/beacon/c360a/YOUR_TENANT_ID/scripts/c360a.min.js"></script> -->

  <!-- Syne font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c8a96e;
      --gold-dim: rgba(200, 169, 110, 0.45);
      --gold-faint: rgba(200, 169, 110, 0.10);
      --text: #e8e4dc;
      --muted: #cc6633;
      --card-bg: rgba(8, 8, 10, 0.52);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-hover: rgba(255, 255, 255, 0.16);
    }

    html, body {
      min-height: 100%;
      font-family: 'Syne', sans-serif;
      color: var(--text);
      background-color: #0c0c0d;
    }

    /* Background image */
    body {
      background-image: url('./assets/images/hero-bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Dark overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(5, 5, 6, 0.70) 0%,
        rgba(5, 5, 6, 0.58) 40%,
        rgba(5, 5, 6, 0.74) 100%
      );
      z-index: 0;
    }

    /* Ambient warm glow */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.05) 0%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────
       PERSONALIZATION: ANNOUNCEMENT BAR (header)
       Content zone: announcement_bar
       Hidden by default — Personalization shows it
    ───────────────────────────────────────────── */
    #pers-announcement-bar {
      display: none; /* shown by Personalization */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(8, 8, 10, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(200, 169, 110, 0.18);
    }

    #pers-announcement-bar.is-visible {
      display: block;
      animation: slideDown 0.4s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    .announcement-inner {
      max-width: 390px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .announcement-icon {
      color: var(--gold);
      font-size: 11px;
      flex-shrink: 0;
    }

    /* Content zone: announcement_text — Personalization fills this */
    #pers-announcement-text {
      flex: 1;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.8px;
      color: var(--text);
      line-height: 1.4;
    }

    /* Content zone: announcement_cta — Personalization fills this */
    #pers-announcement-cta {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      flex-shrink: 0;
    }

    #pers-announcement-cta:hover {
      border-bottom-color: var(--gold);
    }

    .announcement-close {
      background: none;
      border: none;
      color: rgba(232, 228, 220, 0.4);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      flex-shrink: 0;
      transition: color 0.2s ease;
      line-height: 1;
    }

    .announcement-close:hover {
      color: var(--text);
    }

    /* Page layout — shifts down when bar is visible */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 40px;
      transition: padding-top 0.4s cubic-bezier(.22,1,.36,1);
    }

    body.has-announcement .page {
      padding-top: 90px;
    }

    /* Centered column */
    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ── */
    .logo-wrap {
      position: relative;
      width: 102px;
      height: 102px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0s forwards;
    }

    .logo-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(14, 14, 16, 0.7);
      border: 1px solid rgba(200, 169, 110, 0.22);
      position: relative;
      z-index: 1;
    }

    .logo-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(200, 169, 110, 0.45);
      border-right-color: rgba(200, 169, 110, 0.10);
      animation: spin 9s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Name ── */
    .name {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.07s forwards;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.13s forwards;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.17s forwards;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200, 169, 110, 0.35));
    }

    .divider-line:last-child {
      background: linear-gradient(to left, transparent, rgba(200, 169, 110, 0.35));
    }

    .divider-gem {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 32px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      transition:
        transform 0.22s cubic-bezier(.22,1,.36,1),
        border-color 0.22s ease,
        box-shadow 0.22s ease;
      opacity: 0;
    }

    .link-card:nth-child(1) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.24s forwards; }
    .link-card:nth-child(2) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.33s forwards; }
    .link-card:nth-child(3) { animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.42s forwards; }

    /* Gold left-bar */
    .link-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.22s ease;
      border-radius: 14px 0 0 14px;
    }

    /* Gold glow fill */
    .link-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at left center, rgba(200, 169, 110, 0.07) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--card-border-hover);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .link-card:hover::before,
    .link-card:hover::after { opacity: 1; }

    .link-card:active { transform: scale(0.98); }

    /* Icon bubble */
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .card-icon svg { width: 22px; height: 22px; }

    /* Card text */
    .card-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .card-platform {
      display: block;
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .card-label {
      display: block;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--text);
    }

    /* Arrow */
    .card-arrow {
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      position: relative;
      z-index: 1;
      transition: color 0.22s ease, transform 0.22s ease;
      flex-shrink: 0;
    }

    .link-card:hover .card-arrow {
      color: var(--gold);
      transform: translateX(4px);
    }

    /* ─────────────────────────────────────────────
       PERSONALIZATION: FOOTER FEATURED ZONE
       Content zone: footer_featured
       Personalization injects a featured card here
    ───────────────────────────────────────────── */
    #pers-footer-featured {
      width: 100%;
      margin-bottom: 20px;
    }

    /* Default empty state — hidden until Personalization fills it */
    #pers-footer-featured:empty { display: none; }

    /* Personalization injects a .featured-card into this zone */
    .featured-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(200, 169, 110, 0.06);
      border: 1px solid rgba(200, 169, 110, 0.15);
      text-decoration: none;
      color: var(--text);
      transition: background 0.22s ease, border-color 0.22s ease;
    }

    .featured-card:hover {
      background: rgba(200, 169, 110, 0.10);
      border-color: rgba(200, 169, 110, 0.28);
    }

    .featured-card-eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
    }

    .featured-card-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.56s forwards;
      width: 100%;
    }

    /* Content zone: footer_message — optional personalized tagline above link */
    #pers-footer-message {
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(232, 228, 220, 0.45);
      margin-bottom: 8px;
      min-height: 0;
    }

    #pers-footer-message:empty { display: none; }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .footer-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(200, 169, 110, 0.35);
      flex-shrink: 0;
    }

    .footer-link {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-decoration: none;
      text-transform: lowercase;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--text);
      border-bottom-color: rgba(232, 228, 220, 0.3);
    }

    .footer-link.footer-link--subtle {
      color: rgba(232, 228, 220, 0.35);
    }

    .footer-link.footer-link--subtle:hover {
      color: var(--gold);
      border-bottom-color: rgba(200, 169, 110, 0.35);
    }

    /* ── Entrance animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Version badge ── */
    .version-badge {
      position: fixed;
      bottom: 12px;
      right: 14px;
      z-index: 50;
      font-family: 'Syne', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 1.2px;
      color: rgba(232, 228, 220, 0.25);
      background: rgba(8, 8, 10, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 3px 7px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      user-select: none;
    }

    /* ─────────────────────────────────────────────
       PERSONALIZATION: POPUP / MODAL
       Content zones: popup_content, popup_headline,
                      popup_body, popup_cta
       Hidden by default — JS shows on pers trigger
    ───────────────────────────────────────────── */
    #pers-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 5, 6, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #pers-popup-overlay.is-visible {
      display: flex;
      animation: fadeIn 0.35s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .popup-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: rgba(10, 10, 12, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(200, 169, 110, 0.20);
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      animation: popUp 0.4s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes popUp {
      from { transform: translateY(24px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    /* Gold top accent line */
    .popup-card::before {
      content: '';
      position: absolute;
      top: 0; left: 28px; right: 28px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200, 169, 110, 0.5), transparent);
      border-radius: 1px;
    }

    .popup-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: rgba(232, 228, 220, 0.35);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .popup-close:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }

    /* Content zone: popup_eyebrow */
    #pers-popup-eyebrow {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    #pers-popup-eyebrow:empty { display: none; }

    /* Content zone: popup_headline */
    #pers-popup-headline {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    /* Content zone: popup_body */
    #pers-popup-body {
      font-size: 13.5px;
      font-weight: 400;
      color: rgba(232, 228, 220, 0.70);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    /* Content zone: popup_cta — Personalization fills href + text */
    #pers-popup-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      background: var(--gold);
      color: #0c0c0d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      width: 100%;
      justify-content: center;
    }

    #pers-popup-cta:hover {
      background: #d4b87a;
      transform: translateY(-1px);
    }

    #pers-popup-cta:empty { display: none; }

    /* Popup reason tag (shown below CTA) */
    .popup-reason {
      margin-top: 14px;
      text-align: center;
      font-size: 9.5px;
      letter-spacing: 1.2px;
      color: rgba(232, 228, 220, 0.25);
      text-transform: uppercase;
    }

    /* Content zone: popup_reason — Personalization fills this */
    #pers-popup-reason:empty { display: none; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════
       PERSONALIZATION ZONE 1: ANNOUNCEMENT BAR
       Zone name: announcement_bar
       Personalization shows this bar with a targeted message + CTA.
       Examples: "New video out now →", "Welcome back, Anthony fan!"
  ════════════════════════════════════════════════════════════════ -->
  <div id="pers-announcement-bar" role="banner" aria-live="polite">
    <div class="announcement-inner">
      <span class="announcement-icon" aria-hidden="true">✦</span>
      <!-- Zone: announcement_text -->
      <span id="pers-announcement-text"></span>
      <!-- Zone: announcement_cta -->
      <a id="pers-announcement-cta" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button
        class="announcement-close"
        aria-label="Dismiss announcement"
        onclick="ABPersonalization.dismissBar()"
      >✕</button>
    </div>
  </div>

  <div class="page">
    <div class="container">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <img
          class="logo-img"
          src="./ALB_Logo_White_Transparent.png"
          alt="Anthony Best"
          loading="eager"
        >
      </div>

      <!-- Name -->
      <h1 class="name">Anthony Best</h1>

      <!-- Tagline -->
      <p class="tagline">Youtuber &middot; Musician &middot; Collector</p>

      <!-- Ornamental divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-gem"></div>
        <div class="divider-line"></div>
      </div>

      <!-- Social cards -->
      <div class="cards">

        <!-- YouTube -->
        <a class="link-card" href="https://youtube.com/c/anthonybestmusic" target="_blank" rel="noopener noreferrer">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#ff4444" d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805z"/>
              <path fill="#fff" d="M9.609 15.601V8.408l6.264 3.602z"/>
            </svg>
          </div>

       Zones: popup_eyebrow, popup_headline, popup_body,
              popup_cta, popup_reason
       Hidden by default. Call ABPersonalization.showPopup()
       from sitemap.js to display. Personalization fills each
       sub-zone with targeted copy + CTA before calling showPopup.
  ════════════════════════════════════════════════════════════════ -->
  <div
    id="pers-popup-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pers-popup-headline"
  >
    <div class="popup-card">
      <button
        class="popup-close"
        aria-label="Close"
        onclick="ABPersonalization.dismissPopup()"
      >✕</button>

      <!-- Zone: popup_eyebrow — e.g. "New Release" / "Just for you" -->
      <p id="pers-popup-eyebrow"></p>

      <!-- Zone: popup_headline — main personalized headline -->
      <h2 id="pers-popup-headline"></h2>

      <!-- Zone: popup_body — supporting copy -->
      <p id="pers-popup-body"></p>

      <!-- Zone: popup_cta — Personalization sets href + link text -->
      <a id="pers-popup-cta" href="#" target="_blank" rel="noopener noreferrer"></a>

      <!-- Zone: popup_reason — explains WHY this was shown -->
      <p class="popup-reason">
        <span id="pers-popup-reason"></span>
      </p>
    </div>
  </div>

  <!-- Version badge — update this number on each deploy -->
  <div class="version-badge">v19</div>

  <!-- ═══════════════════════════════════════════════════════════════
       PERSONALIZATION UTILITY API
       ABPersonalization — called by sitemap.js action handlers
       to show / dismiss zones without framework dependencies.
  ════════════════════════════════════════════════════════════════ -->
  <script>
    window.ABPersonalization = (function () {

      // ── Announcement Bar ──────────────────────────────────────────
      function showBar() {
        var bar = document.getElementById('pers-announcement-bar');
        if (bar) {
          bar.classList.add('is-visible');
          document.body.classList.add('has-announcement');
        }
      }

      function dismissBar() {
        var bar = document.getElementById('pers-announcement-bar');
        if (bar) {
          bar.classList.remove('is-visible');
          document.body.classList.remove('has-announcement');
        }
        // Track dismissal
        if (window.SalesforceInteractions) {
          SalesforceInteractions.sendEvent({
            interaction: { name: 'Announcement Bar Dismissed' }
          });
        }
      }

      // ── Popup ─────────────────────────────────────────────────────
      function showPopup() {
        var overlay = document.getElementById('pers-popup-overlay');
        if (overlay) {
          overlay.classList.add('is-visible');
          document.body.style.overflow = 'hidden';
        }
      }

      function dismissPopup() {
        var overlay = document.getElementById('pers-popup-overlay');
        if (overlay) {
          overlay.classList.remove('is-visible');
          document.body.style.overflow = '';
        }
        // Track dismissal
        if (window.SalesforceInteractions) {
          SalesforceInteractions.sendEvent({
            interaction: { name: 'Popup Dismissed' }
          });
        }
      }

      // Close popup on overlay click (outside card)
      document.getElementById('pers-popup-overlay')
        .addEventListener('click', function (e) {
          if (e.target === this) dismissPopup();
        });

      // Close on Escape key
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') dismissPopup();
      });

      return { showBar: showBar, dismissBar: dismissBar, showPopup: showPopup, dismissPopup: dismissPopup };
    })();
  </script>
