name: Smoke test (post-deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SITE_URL: https://anthonybest.com

jobs:
  smoke_test:
    name: Smoke test (post-deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Worker deploy to be live and run tests
        env:
          BASE_URL: ${{ env.SITE_URL }}
          WAIT_TIMEOUT: "90"
          POLL_INTERVAL: "5"
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
