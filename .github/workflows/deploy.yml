name: Deploy to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEROKU_APP_URL: https://anthonybest-bf380286087d.herokuapp.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version badge
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="v${COUNT} · ${SHA}"
          sed -i "s|<div class=\"version-badge\">.*</div>|<div class=\"version-badge\">${VERSION}</div>|g" src/index.html
          echo "Stamped: ${VERSION}"

      - name: Deploy to Heroku via git push
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/anthonybest.git
          git add src/index.html
          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          git commit -m "chore: stamp version badge [skip ci]" || true
          git push heroku HEAD:main --force

  smoke_test:
    name: Smoke test (post-deploy)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Heroku dyno to be live and run tests
        env:
          BASE_URL: ${{ env.HEROKU_APP_URL }}
          WAIT_TIMEOUT: "90"
          POLL_INTERVAL: "5"
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
